<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ask AI — Soch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:    #f3ffc9;
    --cream-88: rgba(243,255,201,0.88);
    --cream-60: rgba(243,255,201,0.60);
    --cream-45: rgba(243,255,201,0.45);
    --cream-12: rgba(243,255,201,0.12);
    --cream-06: rgba(243,255,201,0.06);
    --black:    #000000;
    --panel:    #111111;
  }

  html, body {
    width: 100%;
    background: var(--black);
    font-family: 'Wix Madefor Text', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── SECTION ─── */
  .ask-section {
    width: 100%;
    padding: 0 40px;
  }

  /* ─── CARD ─── */
  .ask-card {
    width: 100%;
    background: var(--panel);
    border-radius: 20px;
    border: 1px solid var(--cream-12);
    padding: 72px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* subtle radial glow matching cream accent */
  .ask-card::before {
    content: '';
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 320px;
    background: radial-gradient(ellipse at center, rgba(243,255,201,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ─── EYEBROW ─── */
  .ask-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cream-45);
    margin-bottom: 16px;
  }

  /* ─── HEADING ─── */
  .ask-heading {
    font-size: clamp(32px, 4vw, 52px);
    font-weight: 700;
    line-height: 1.07;
    letter-spacing: -0.028em;
    color: var(--cream);
    margin-bottom: 20px;
    max-width: 680px;
  }

  /* ─── SUBTEXT ─── */
  .ask-sub {
    font-size: 16px;
    font-weight: 400;
    line-height: 1.7;
    color: var(--cream-60);
    max-width: 480px;
    margin-bottom: 48px;
  }

  /* ─── BUTTONS ROW ─── */
  .ask-btns {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* base button — cream filled, dark text, pill shape — matches screenshot */
  .ask-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Wix Madefor Text', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #111;
    text-decoration: none;
    background: var(--cream);
    border: none;
    border-radius: 100px;
    padding: 14px 28px;
    transition: background 0.22s ease, transform 0.18s ease, box-shadow 0.22s ease;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  .ask-btn:hover {
    background: #e8f5b0;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(243,255,201,0.15);
  }

  .ask-btn svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 640px) {
    .ask-section { padding: 0 16px; }
    .ask-card { padding: 48px 24px; border-radius: 16px; }
    .ask-btns { flex-direction: column; align-items: center; }
    .ask-btn { width: 100%; max-width: 280px; justify-content: center; }
    .ask-heading { font-size: 28px; }
  }
</style>
</head>
<body>

<div class="ask-section">
  <div class="ask-card">

    <p class="ask-eyebrow">Don't take our word for it</p>

    <h2 class="ask-heading">Ask AI about Soch</h2>

    <p class="ask-sub">Pick your favourite AI and ask what it thinks about us. No filter, no spin — just what the models know.</p>

    <div class="ask-btns">

        </svg>
        Ask ChatGPT
      </a>

      <!-- Perplexity -->
      <a class="ask-btn"
         href="https://www.perplexity.ai/?q=What%20do%20you%20know%20about%20Soch%2C%20the%20AI%20automation%20agency%20at%20withsoch.com%3F"
         target="_blank" rel="noopener">
        <!-- Perplexity logo -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L8.5 7H4l3.25 3.5L4 14h4.5L12 19l3.5-5H20l-3.25-3.5L20 7h-4.5L12 2z" stroke="#111" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
          <line x1="12" y1="2" x2="12" y2="22" stroke="#111" stroke-width="1.5"/>
          <line x1="4" y1="7" x2="20" y2="7" stroke="#111" stroke-width="1.5"/>
          <line x1="4" y1="14" x2="20" y2="14" stroke="#111" stroke-width="1.5"/>
        </svg>
        Ask Perplexity
      </a>

      <!-- Claude -->
      <a class="ask-btn"
         href="https://claude.ai/new?q=What%20do%20you%20know%20about%20Soch%2C%20the%20AI%20automation%20agency%20at%20withsoch.com%3F"
         target="_blank" rel="noopener">
        <!-- Anthropic / Claude logo -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13.827 3.52h-3.654L5.443 20.4h3.33l1.027-3.209h4.4l1.027 3.21h3.33L13.827 3.52zm-3.258 11.19 1.431-4.676 1.432 4.675h-2.863z" fill="#111"/>
        </svg>
        Ask Claude
      </a>

    </div>
  </div>
</div>

</body>
</html>
